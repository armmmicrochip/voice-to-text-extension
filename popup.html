<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Input Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4z"/>
      <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 11z"/>
    </svg>
    <div class="title-block">
      <h1>Voice Input Assistant</h1>
      <span id="status-badge" class="badge">Active</span>
    </div>
  </header>

  <section class="how-to">
    <h2>How to use</h2>
    <ol>
      <li>Click any <strong>text</strong>, <strong>search</strong>, <strong>email</strong>, or <strong>textarea</strong> field.</li>
      <li>A <span class="mic-hint">🎤</span> button appears next to the field.</li>
      <li>Click it (or press <kbd id="shortcut-label">Ctrl+Shift+Space</kbd>) and speak.</li>
      <li>Click <span class="stop-hint"></span> to stop — text is inserted automatically.</li>
    </ol>
  </section>

  <section class="settings">
    <h2>Settings</h2>
    <label for="lang-select">Recognition language</label>
    <select id="lang-select">
      <optgroup label="English">
        <option value="en-US">English (United States)</option>
        <option value="en-GB">English (United Kingdom)</option>
        <option value="en-AU">English (Australia)</option>
      </optgroup>
      <optgroup label="European">
        <option value="de-DE">Deutsch (Germany)</option>
        <option value="fr-FR">Français (France)</option>
        <option value="es-ES">Español (Spain)</option>
        <option value="it-IT">Italiano (Italy)</option>
        <option value="pt-PT">Português (Portugal)</option>
        <option value="nl-NL">Nederlands (Netherlands)</option>
        <option value="pl-PL">Polski (Poland)</option>
        <option value="ru-RU">Русский (Russia)</option>
        <option value="tr-TR">Türkçe (Turkey)</option>
        <option value="sv-SE">Svenska (Sweden)</option>
        <option value="no-NO">Norsk (Norway)</option>
        <option value="da-DK">Dansk (Denmark)</option>
        <option value="fi-FI">Suomi (Finland)</option>
        <option value="cs-CZ">Čeština (Czech Republic)</option>
        <option value="hu-HU">Magyar (Hungary)</option>
      </optgroup>
      <optgroup label="Americas">
        <option value="es-MX">Español (Mexico)</option>
        <option value="pt-BR">Português (Brazil)</option>
      </optgroup>
      <optgroup label="Asia / Middle East">
        <option value="zh-CN">中文 (Simplified)</option>
        <option value="zh-TW">中文 (Traditional)</option>
        <option value="ja-JP">日本語 (Japan)</option>
        <option value="ko-KR">한국어 (Korea)</option>
        <option value="hi-IN">हिन्दी (India)</option>
        <option value="ar-SA">العربية (Arabic)</option>
      </optgroup>
    </select>
    <p class="save-hint" id="save-hint" aria-live="polite"></p>
  </section>

  <footer>
    <span>Voice Input Assistant &mdash; v1.1</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
